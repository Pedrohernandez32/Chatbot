<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual UdeMedellin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="sections.css">
    <link rel="stylesheet" href="sections3.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
        }

        #root {
            min-height: 100vh;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #8B2635 0%, #A61C3C 100%);
            color: white;
            font-size: 24px;
            flex-direction: column;
            gap: 20px;
        }

        .loading h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin: 0;
        }

        .loading p {
            font-size: 1.1em;
            opacity: 0.9;
            margin: 0;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            color: white;
            max-width: 500px;
            margin-top: 20px;
            text-align: center;
        }

        .error-message h2 {
            margin: 0 0 10px 0;
            font-size: 1.3em;
        }

        .error-message p {
            margin: 5px 0;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div id="root" class="loading">
        <div style="text-align: center;">
            <h1>🎓 Asistente Virtual UdeMedellin</h1>
            <p>Cargando componentes...</p>
            <div class="spinner"></div>
            <p style="font-size: 0.9em; opacity: 0.7;">Por favor espera mientras se inicializa el sistema</p>
        </div>
    </div>

    <!-- React y dependencias -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <!-- Sistema de carga de componentes -->
    <script>
        window.JSXComponents = {
            loaded: [],
            errors: [],
            total: 9,

            track: (name, success, error) => {
                if (success) {
                    window.JSXComponents.loaded.push(name);
                    console.log(`✅ ${name} cargado (${window.JSXComponents.loaded.length}/${window.JSXComponents.total})`);
                } else {
                    window.JSXComponents.errors.push({ name, error });
                    console.error(`❌ Error cargando ${name}:`, error);
                }
                window.JSXComponents.checkComplete();
            },

            checkComplete: () => {
                const { loaded, total, errors } = window.JSXComponents;
                const root = document.getElementById('root');

                if (loaded.length === total && errors.length === 0) {
                    console.log('🎉 ¡Todos los componentes cargados exitosamente!');
                    setTimeout(() => {
                        root.classList.remove('loading');
                    }, 300);
                } else if (loaded.length + errors.length === total) {
                    if (errors.length > 0) {
                        console.warn(`⚠️ Se cargaron con ${errors.length} error(s)`);
                        let errorHTML = `
                            <div class="error-message">
                                <h2>⚠️ Error de Carga</h2>
                                <p>Se encontraron errores en:</p>`;
                        errors.forEach(e => {
                            errorHTML += `<p><strong>${e.name}</strong>: ${e.error}</p>`;
                        });
                        errorHTML += `<p style="margin-top: 15px; font-size: 0.85em;">Abre la consola (F12) para más detalles.</p>
                                    </div>`;
                        root.innerHTML = errorHTML;
                    }
                }
            }
        };

        window.addEventListener('error', (event) => {
            console.error('Error global:', event.error);
            if (event.error && event.error.message) {
                window.JSXComponents.errors.push({
                    name: 'Script',
                    error: event.error.message
                });
            }
        });
    </script>

    <!-- Componentes en orden correcto con manejo de errores -->
    <script type="text/babel" src="icons.jsx" onload="window.JSXComponents.track('icons.jsx', true)" onerror="window.JSXComponents.track('icons.jsx', false, event.message)"></script>
    <script type="text/babel" src="escalada.jsx" onload="window.JSXComponents.track('escalada.jsx', true)" onerror="window.JSXComponents.track('escalada.jsx', false, event.message)"></script>
    <script type="text/babel" src="chat.jsx" onload="window.JSXComponents.track('chat.jsx', true)" onerror="window.JSXComponents.track('chat.jsx', false, event.message)"></script>
    <script type="text/babel" src="sections.jsx" onload="window.JSXComponents.track('sections.jsx', true)" onerror="window.JSXComponents.track('sections.jsx', false, event.message)"></script>
    <script type="text/babel" src="sections2.jsx" onload="window.JSXComponents.track('sections2.jsx', true)" onerror="window.JSXComponents.track('sections2.jsx', false, event.message)"></script>
    <script type="text/babel" src="sections3.jsx" onload="window.JSXComponents.track('sections3.jsx', true)" onerror="window.JSXComponents.track('sections3.jsx', false, event.message)"></script>
    <script type="text/babel" src="admin.jsx" onload="window.JSXComponents.track('admin.jsx', true)" onerror="window.JSXComponents.track('admin.jsx', false, event.message)"></script>
    <script type="text/babel" src="login.jsx" onload="window.JSXComponents.track('login.jsx', true)" onerror="window.JSXComponents.track('login.jsx', false, event.message)"></script>
    <script type="text/babel" src="app.jsx" onload="window.JSXComponents.track('app.jsx', true)" onerror="window.JSXComponents.track('app.jsx', false, event.message)"></script>

    <!-- Inicialización de App después de cargar todos los componentes -->
    <script>
        setTimeout(() => {
            try {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<App />);
                console.log('🚀 Aplicación renderizada exitosamente');
            } catch (e) {
                console.error('Error renderizando App:', e);
                document.getElementById('root').innerHTML = `
                    <div class="error-message" style="margin-top: 50vh; transform: translateY(-50%);">
                        <h2>❌ Error Fatal</h2>
                        <p>No se pudo renderizar la aplicación</p>
                        <p style="font-size: 0.85em; margin-top: 15px;">${e.message}</p>
                        <p style="font-size: 0.85em;">Abre la consola (F12) para más detalles</p>
                    </div>
                `;
            }
        }, 500);
    </script>
</body>
</html>
