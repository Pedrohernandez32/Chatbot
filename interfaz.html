<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual UdeMedellin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="sections.css">

    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #root { min-height: 100vh; }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 24px;
        }

    <div id="root" class="loading">

    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <!-- Componentes en orden correcto -->
    <script type="text/babel" src="icons.jsx"></script>
    <script type="text/babel" src="chat.jsx"></script>
    <script type="text/babel" src="sections.jsx"></script>
    <script type="text/babel" src="sections2.jsx"></script>
    <script type="text/babel" src="sections3.jsx"></script>
    <script type="text/babel" src="admin.jsx"></script>
    <script type="text/babel" src="login.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>

    <script>
        console.log("Interfaz cargada");
        document.getElementById('root').classList.remove('loading');
    </script>
</body>
</html>
