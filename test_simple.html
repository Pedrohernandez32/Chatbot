<!DOCTYPE html>
<html>
<head>
    <title>PRUEBA SIMPLE</title>
    <style>
        body {
            font-family: Arial;
            padding: 50px;
            background: white;
            color: black;
            font-size: 24px;
        }
        h1 { color: red; }
        .box {
            background: #FFD700;
            padding: 30px;
            margin: 20px 0;
            border: 5px solid red;
        }
    </style>
</head>
<body>
    <h1>SI VES ESTO - EL SERVIDOR FUNCIONA</h1>

    <div class="box">
        <p><strong>✅ SERVIDOR ACTIVO Y FUNCIONANDO</strong></p>
        <p>Si ves este texto amarillo con borde rojo, significa que el servidor está sirviendo correctamente.</p>
    </div>

    <p>Ahora voy a cargar la interfaz de Claude Design...</p>

    <hr style="margin: 40px 0; border: 2px solid red;">

    <h2>Cargando componentes:</h2>
    <div id="status">
        <p>Loading React...</p>
        <p id="react-check">⏳</p>
        <p id="babel-check">⏳</p>
        <p id="app-check">⏳</p>
    </div>

    <div id="root" style="margin-top: 40px; border: 2px solid blue; padding: 20px;"></div>

    <!-- Librerías -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

    <script>
        console.log("Script base cargado");
        document.getElementById('react-check').textContent = typeof React !== 'undefined' ? '✅ React OK' : '❌ React FAIL';
        document.getElementById('babel-check').textContent = typeof Babel !== 'undefined' ? '✅ Babel OK' : '❌ Babel FAIL';
    </script>

    <!-- Cargar JSX -->
    <script type="text/babel">
        document.getElementById('app-check').textContent = '✅ Babel compilando...';
        console.log("Babel cargó correctamente");

        function SimpleApp() {
            return (
                <div style={{padding: '20px', background: '#e8f4f8', borderRadius: '10px'}}>
                    <h2>✅ COMPONENTES REACT FUNCIONAN</h2>
                    <p>Los componentes de React están compilados y montados correctamente.</p>
                    <p>Ahora cargaremos la interfaz completa de Claude Design...</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SimpleApp />);
        document.getElementById('app-check').textContent = '✅ App montada';
    </script>

    <!-- Ahora cargar los componentes reales -->
    <script type="text/babel" src="icons.jsx"></script>
    <script type="text/babel" src="chat.jsx"></script>
    <script type="text/babel" src="sections.jsx"></script>
    <script type="text/babel" src="sections2.jsx"></script>
    <script type="text/babel" src="sections3.jsx"></script>
    <script type="text/babel" src="admin.jsx"></script>
    <script type="text/babel" src="login.jsx"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="sections.css">
    <link rel="stylesheet" href="sections3.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="admin.css">

    <!-- APP FINAL -->
    <script type="text/babel">
        try {
            if (typeof App !== 'undefined') {
                const appRoot = ReactDOM.createRoot(document.getElementById('root'));
                appRoot.render(<App />);
                console.log("✅ App de Claude Design montada correctamente");
            } else {
                console.error("App no está definida");
                document.getElementById('root').innerHTML = '<p style="color: red;">ERROR: App no está definida</p>';
            }
        } catch (e) {
            console.error("Error montando app:", e);
            document.getElementById('root').innerHTML = '<p style="color: red;">ERROR: ' + e.message + '</p>';
        }
    </script>

    <!-- Manejo de errores global -->
    <script>
        window.addEventListener('error', function(e) {
            console.error("Error global:", e.message, e.filename, e.lineno);
            document.body.innerHTML += '<div style="background: red; color: white; padding: 20px; margin: 20px;">ERROR: ' + e.message + '</div>';
        });
    </script>
</body>
</html>
