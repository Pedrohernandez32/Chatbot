<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug - Asistente Virtual</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        h1 { color: #333; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .status.loading { background: #fff3cd; color: #856404; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.success { background: #d4edda; color: #155724; }
        #errors { background: #f8f9fa; padding: 15px; border-radius: 5px; border-left: 4px solid #dc3545; margin-top: 20px; }
        #errors pre { overflow-x: auto; white-space: pre-wrap; }
        .libs { margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Depuración - Asistente Virtual UdeMedellin</h1>

        <div class="status loading" id="status">
            Cargando librerías y componentes...
        </div>

        <div class="libs">
            <h3>Librerías cargadas:</h3>
            <p>✓ React: <span id="react-status">comprobando...</span></p>
            <p>✓ ReactDOM: <span id="reactdom-status">comprobando...</span></p>
            <p>✓ Babel: <span id="babel-status">comprobando...</span></p>
        </div>

        <div id="errors" style="display:none;">
            <h3>❌ Errores detectados:</h3>
            <pre id="error-list"></pre>
        </div>

        <div id="app-container" style="margin-top: 30px; display:none;">
            <h2>✅ Cargando interfaz...</h2>
            <div id="root"></div>
        </div>
    </div>

    <script>
        // Capturar errores
        const errors = [];
        window.addEventListener('error', (e) => {
            errors.push(`ERROR: ${e.message}\nArchivo: ${e.filename}:${e.lineno}`);
            updateErrorDisplay();
        });

        window.addEventListener('unhandledrejection', (e) => {
            errors.push(`UNHANDLED REJECTION: ${e.reason}`);
            updateErrorDisplay();
        });

        function updateErrorDisplay() {
            if (errors.length > 0) {
                document.getElementById('errors').style.display = 'block';
                document.getElementById('error-list').textContent = errors.join('\n\n');
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = `❌ ${errors.length} error(es) detectado(s)`;
            }
        }

        // Verificar librerías
        setTimeout(() => {
            document.getElementById('react-status').textContent = typeof React !== 'undefined' ? '✅' : '❌';
            document.getElementById('reactdom-status').textContent = typeof ReactDOM !== 'undefined' ? '✅' : '❌';
            document.getElementById('babel-status').textContent = typeof Babel !== 'undefined' ? '✅' : '❌';
        }, 1000);
    </script>

    <!-- Librerías -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <!-- Componentes JSX -->
    <script type="text/babel" src="icons.jsx"></script>
    <script type="text/babel" src="chat.jsx"></script>
    <script type="text/babel" src="sections.jsx"></script>
    <script type="text/babel" src="sections2.jsx"></script>
    <script type="text/babel" src="sections3.jsx"></script>
    <script type="text/babel" src="admin.jsx"></script>
    <script type="text/babel" src="login.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="sections.css">
    <link rel="stylesheet" href="sections3.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="admin.css">

    <script>
        setTimeout(() => {
            if (errors.length === 0) {
                document.getElementById('status').className = 'status success';
                document.getElementById('status').textContent = '✅ Todo cargado correctamente';
                document.getElementById('app-container').style.display = 'block';
            }
        }, 3000);
    </script>
</body>
</html>
