<!DOCTYPE html>
<html>
<head>
    <title>Debug - Chatbot UdeMedellin</title>
</head>
<body>
    <h1>Estado del Servidor</h1>
    <p id="status">Cargando...</p>
    
    <h2>Archivos Disponibles:</h2>
    <ul id="files"></ul>
    
    <script>
        document.getElementById('status').textContent = 'Servidor respondiendo correctamente';
        
        // Listar archivos
        const files = ['styles.css', 'chat.css', 'sections.css', 'icons.jsx', 'chat.jsx', 'app.jsx'];
        const list = document.getElementById('files');
        files.forEach(f => {
            const li = document.createElement('li');
            li.textContent = f;
            list.appendChild(li);
        });
    </script>
</body>
</html>
