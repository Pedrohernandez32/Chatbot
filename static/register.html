<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Universidad de Medellín</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --r: #C8102E;
            --rd: #9B0B22;
            --rl: #F5E6E8;
            --ink: #1C1410;
            --ink2: #5C4A42;
            --ink3: #9C8880;
            --bg: #FAFAF8;
            --bg2: #F3F0EC;
            --bg3: #FFFFFF;
            --bdr: rgba(200, 16, 46, 0.14);
            --bdr2: rgba(200, 16, 46, 0.28);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--r) 0%, var(--rd) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-page-container {
            background: var(--bg3);
            padding: 32px 36px;
            border-radius: 18px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo {
            width: 54px;
            height: 54px;
            margin: 0 auto 14px;
            background: var(--r);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 18px;
            font-family: 'Syne', sans-serif;
        }
        .login-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .login-header p {
            font-size: .75rem;
            color: var(--ink3);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: .72rem;
            font-weight: 500;
            color: var(--ink2);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--bdr2);
            border-radius: 8px;
            font-size: .84rem;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color .2s;
        }
        .form-group input:focus {
            border-color: var(--r);
        }
        .form-group input::placeholder {
            color: var(--ink3);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--r);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: .85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background .2s;
            margin-top: 8px;
        }
        .btn-primary:hover {
            background: var(--rd);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: .78rem;
            color: var(--ink3);
        }
        .login-footer a {
            color: var(--r);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            text-align: center;
            margin-top: 16px;
        }
        .back-link a {
            color: var(--ink3);
            text-decoration: none;
            font-size: .75rem;
        }
        .back-link a:hover {
            color: var(--r);
        }
        .error-msg {
            background: var(--rl);
            color: var(--r);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: .78rem;
            margin-bottom: 14px;
            text-align: center;
        }
        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: .78rem;
            margin-bottom: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-page-container">
        <div class="login-header">
            <div class="login-logo">UDM</div>
            <h1>Universidad de Medellín</h1>
            <p>Asistente Virtual</p>
        </div>

        <div id="messageMsg" class="success-msg" style="display:none;"></div>
        <div id="errorMsg" class="error-msg" style="display:none;"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="registerUsername">Nombre de usuario</label>
                <input type="text" id="registerUsername" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">Correo electrónico</label>
                <input type="email" id="registerEmail" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Contraseña</label>
                <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn-primary">Crear Cuenta</button>
        </form>

        <p class="login-footer">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
        </p>

        <div class="back-link">
            <a href="/">← Volver al chat</a>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            const errorMsg = document.getElementById('errorMsg');
            const messageMsg = document.getElementById('messageMsg');
            errorMsg.style.display = 'none';
            messageMsg.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.ok) {
                    messageMsg.textContent = '¡Cuenta creada! Ahora puedes iniciar sesión.';
                    messageMsg.style.display = 'block';
                    document.getElementById('registerForm').reset();
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    const data = await response.json();
                    errorMsg.textContent = data.error || 'Error al registrarse';
                    errorMsg.style.display = 'block';
                }
            } catch (e) {
                errorMsg.textContent = 'Error al registrarse';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
